<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PID Simulator</title>
<style>
  :root {
    --bg: #0E0B16; --panel: #130F1E; --border: #2C2540; --text: #E6E1F2;
    --muted: #A49BBF; --accent: #A371F7; --line: #4ADE80; --target: #F87171; --ctrl: #C5A3FF;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, "Segoe UI", sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 24px 16px 48px; display: grid; gap: 20px; }
  h1 { margin: 0; font-size: 26px; }
  .sub { margin: 4px 0 0; color: var(--muted); }
  .layout { display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start; }
  .controls { flex: 1 1 260px; max-width: 340px; display: grid; gap: 14px; }
  .charts { flex: 999 1 520px; min-width: 0; display: grid; gap: 14px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
  label { display: grid; gap: 6px; font-size: 14px; }
  .row { display: flex; justify-content: space-between; align-items: baseline; }
  .val { font-family: ui-monospace, Consolas, monospace; color: var(--ctrl); }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  select { width: 100%; min-height: 40px; background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 0 10px; font: inherit; }
  .seg { display: grid; gap: 14px; }
  .hidden { display: none; }
  canvas { width: 100%; display: block; }
  .metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
  .metric { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 12px; }
  .metric .k { font-size: 12px; color: var(--muted); }
  .metric .v { font-size: 20px; font-weight: 600; font-family: ui-monospace, Consolas, monospace; }
  .legend { display: flex; flex-wrap: wrap; gap: 16px; font-size: 13px; color: var(--muted); }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
  .err { color: var(--target); font-size: 14px; }
  button { min-height: 40px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font: inherit; cursor: pointer; padding: 0 12px; }
  button:hover { border-color: var(--accent); }
  .presets { display: flex; flex-wrap: wrap; gap: 8px; }
  a { color: var(--ctrl); }
</style>
</head>
<body>
<main>
  <header>
    <h1>PID Simulator</h1>
    <p class="sub">Tune Kp, Ki and Kd and watch the motor reach its target speed. Every change is simulated by a FastAPI backend.</p>
  </header>

  <div class="layout">
    <section class="controls">
      <div class="card seg">
        <label>Motor model
          <select id="model">
            <option value="simple">Simple (PID output changes speed directly)</option>
            <option value="dc_motor">DC motor (same model as my Unity simulator)</option>
          </select>
        </label>
        <div class="presets">
          <button type="button" data-preset="p">Only P</button>
          <button type="button" data-preset="pi">PI</button>
          <button type="button" data-preset="pid">PID</button>
        </div>
      </div>

      <div class="card seg">
        <label><span class="row">Kp <span class="val" id="kpV"></span></span><input type="range" id="kp"></label>
        <label><span class="row">Ki <span class="val" id="kiV"></span></span><input type="range" id="ki"></label>
        <label><span class="row">Kd <span class="val" id="kdV"></span></span><input type="range" id="kd"></label>
        <label><span class="row">Setpoint <span class="val" id="spV"></span></span><input type="range" id="sp"></label>
      </div>

      <div class="card seg hidden" id="motorBox">
        <label><span class="row">Max RPM <span class="val" id="rpmV"></span></span><input type="range" id="rpm" min="50" max="6000" step="1" value="312"></label>
        <label><span class="row">Time constant (s) <span class="val" id="tauV"></span></span><input type="range" id="tau" min="0.01" max="1" step="0.01" value="0.08"></label>
      </div>
    </section>

    <section class="charts">
      <div class="card">
        <div class="legend">
          <span><span class="dot" style="background: var(--line)"></span>Speed</span>
          <span><span class="dot" style="background: var(--target)"></span>Setpoint</span>
        </div>
        <canvas id="chart" height="300" aria-label="Speed over time compared to the setpoint" role="img"></canvas>
      </div>
      <div class="card">
        <div class="legend"><span><span class="dot" style="background: var(--ctrl)"></span><span id="ctrlLabel">Controller output</span></span></div>
        <canvas id="ctrl" height="120" aria-label="Controller output over time" role="img"></canvas>
      </div>
      <div class="metrics">
        <div class="metric"><div class="k">Rise time (90%)</div><div class="v" id="mRise">–</div></div>
        <div class="metric"><div class="k">Overshoot</div><div class="v" id="mOver">–</div></div>
        <div class="metric"><div class="k">Settling time (±2%)</div><div class="v" id="mSettle">–</div></div>
        <div class="metric"><div class="k">Steady-state error</div><div class="v" id="mSse">–</div></div>
      </div>
      <p class="err" id="err" role="alert"></p>
      <p class="sub">API docs: <a href="/docs">/docs</a></p>
    </section>
  </div>
</main>

<script>
const RANGES = {
  simple:   { kp: [0, 3, 0.01, 2],  ki: [0, 0.5, 0.005, 0.1], kd: [0, 0.1, 0.001, 0.05], sp: [0.1, 2, 0.1, 1],   duration: 5, dt: 0.1 },
  dc_motor: { kp: [0, 10, 0.05, 2], ki: [0, 50, 0.5, 20],     kd: [0, 0.2, 0.002, 0],   sp: [10, 312, 1, 200], duration: 1, dt: 0.002 }
};
const PRESETS = {
  simple:   { p: [2, 0, 0],   pi: [2, 0.1, 0],   pid: [2, 0.1, 0.05] },
  dc_motor: { p: [2, 0, 0],   pi: [2, 20, 0],    pid: [4, 30, 0.01] }
};
const $ = id => document.getElementById(id);
const sliders = ["kp", "ki", "kd", "sp", "rpm", "tau"];

function applyRanges(model) {
  const r = RANGES[model];
  for (const k of ["kp", "ki", "kd", "sp"]) {
    const [min, max, step, val] = r[k];
    Object.assign($(k), { min, max, step }); $(k).value = val;
  }
  if (model === "dc_motor") $("sp").max = $("rpm").value;
  $("motorBox").classList.toggle("hidden", model !== "dc_motor");
  $("ctrlLabel").textContent = model === "dc_motor" ? "Motor power (−1 … 1)" : "Controller output (P + I + D)";
}

function labels() {
  const fmt = (v, d) => Number(v).toFixed(d);
  $("kpV").textContent = fmt($("kp").value, 2);
  $("kiV").textContent = fmt($("ki").value, 3);
  $("kdV").textContent = fmt($("kd").value, 3);
  $("spV").textContent = $("model").value === "dc_motor" ? fmt($("sp").value, 0) + " RPM" : fmt($("sp").value, 1);
  $("rpmV").textContent = $("rpm").value;
  $("tauV").textContent = fmt($("tau").value, 2);
}

let timer = null, requestId = 0;
function schedule() { labels(); clearTimeout(timer); timer = setTimeout(simulate, 60); }

async function simulate() {
  const model = $("model").value, r = RANGES[model], id = ++requestId;
  const body = {
    kp: +$("kp").value, ki: +$("ki").value, kd: +$("kd").value, setpoint: +$("sp").value,
    model, duration: r.duration, dt: r.dt, max_rpm: +$("rpm").value, time_constant: +$("tau").value
  };
  try {
    const res = await fetch("/api/simulate", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    if (!res.ok) throw new Error("Server returned " + res.status);
    const data = await res.json();
    if (id !== requestId) return; // a newer request already started
    $("err").textContent = "";
    draw($("chart"), data.time, [{ y: data.value, color: css("--line") }], data.setpoint);
    draw($("ctrl"), data.time, [{ y: data.control, color: css("--ctrl") }], null, model === "dc_motor" ? [-1, 1] : null);
    showMetrics(data.metrics, model === "dc_motor" ? " RPM" : "");
  } catch (e) {
    $("err").textContent = "Could not reach the API (" + e.message + "). Is uvicorn running?";
  }
}

function css(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }

function showMetrics(m, unit) {
  const s = v => v == null ? "–" : v.toFixed(2) + " s";
  $("mRise").textContent = s(m.rise_time);
  $("mOver").textContent = m.overshoot_percent == null ? "–" : m.overshoot_percent.toFixed(1) + " %";
  $("mSettle").textContent = m.settling_time == null ? "not settled" : s(m.settling_time);
  $("mSse").textContent = m.steady_state_error == null ? "–" : m.steady_state_error.toFixed(3) + unit;
}

function draw(canvas, t, series, target, fixedRange) {
  const dpr = window.devicePixelRatio || 1, w = canvas.clientWidth, h = canvas.height / (canvas._dpr || 1);
  canvas._dpr = dpr; canvas.width = w * dpr; canvas.height = h * dpr;
  const ctx = canvas.getContext("2d"); ctx.scale(dpr, dpr);
  const pad = { l: 48, r: 26, t: 10, b: 24 };
  let lo, hi;
  if (fixedRange) [lo, hi] = fixedRange;
  else {
    const all = series.flatMap(s => s.y).concat(target != null ? [target, 0] : []);
    lo = Math.min(...all); hi = Math.max(...all);
    if (hi - lo < 1e-9) { hi += 1; lo -= 1; }
    const m = (hi - lo) * 0.08; lo -= m; hi += m;
  }
  const tMax = t[t.length - 1] || 1;
  const X = v => pad.l + v / tMax * (w - pad.l - pad.r);
  const Y = v => pad.t + (hi - v) / (hi - lo) * (h - pad.t - pad.b);

  ctx.clearRect(0, 0, w, h);
  ctx.strokeStyle = css("--border"); ctx.fillStyle = css("--muted"); ctx.lineWidth = 1;
  ctx.font = "11px system-ui, sans-serif";
  for (let i = 0; i <= 4; i++) {
    const v = lo + (hi - lo) * i / 4, y = Y(v);
    ctx.beginPath(); ctx.moveTo(pad.l, y); ctx.lineTo(w - pad.r, y); ctx.stroke();
    ctx.fillText(hi - lo > 20 ? v.toFixed(0) : v.toFixed(2), 4, y + 4);
  }
  for (let i = 0; i <= 5; i++) {
    const v = tMax * i / 5;
    ctx.fillText(v.toFixed(2) + "s", X(v) - 12, h - 6);
  }
  if (target != null) {
    ctx.setLineDash([6, 4]); ctx.strokeStyle = css("--target"); ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(pad.l, Y(target)); ctx.lineTo(w - pad.r, Y(target)); ctx.stroke(); ctx.setLineDash([]);
  }
  for (const s of series) {
    ctx.strokeStyle = s.color; ctx.lineWidth = 2; ctx.beginPath();
    s.y.forEach((v, i) => i ? ctx.lineTo(X(t[i]), Y(v)) : ctx.moveTo(X(t[i]), Y(v)));
    ctx.stroke();
  }
}

$("model").addEventListener("change", () => { applyRanges($("model").value); schedule(); });
for (const k of sliders) $(k).addEventListener("input", () => {
  if (k === "rpm") { $("sp").max = $("rpm").value; if (+$("sp").value > +$("rpm").value) $("sp").value = $("rpm").value; }
  schedule();
});
document.querySelectorAll("[data-preset]").forEach(b => b.addEventListener("click", () => {
  const [kp, ki, kd] = PRESETS[$("model").value][b.dataset.preset];
  $("kp").value = kp; $("ki").value = ki; $("kd").value = kd; schedule();
}));
window.addEventListener("resize", schedule);

applyRanges("simple");
schedule();
</script>
</body>
</html>
